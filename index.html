<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Xəbərdarlığı</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #000000;
            color: #00ff00;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: radial-gradient(circle, #111111, #000000);
            border: 2px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px #00ff00;
            max-width: 500px;
            margin: 50px auto;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.1);
            animation: glitch 1s infinite;
            z-index: 1;
        }
        @keyframes glitch {
            0% { clip-path: inset(10% 0 85% 0); }
            25% { clip-path: inset(50% 0 40% 0); }
            50% { clip-path: inset(30% 0 60% 0); }
            75% { clip-path: inset(85% 0 10% 0); }
            100% { clip-path: inset(10% 0 85% 0); }
        }
        h1 {
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
            position: relative;
            z-index: 2;
        }
        p {
            margin: 10px 0;
            position: relative;
            z-index: 2;
        }
        .blinking {
            color: #ff0000;
            font-weight: bold;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ Salam!</h1>
        <p class="blinking">Bu bir phishing hücumudur!</p>
        <p>Hörmətlə,</p>
        <p><strong>InfoSec</strong></p>
    </div>
</body>
</html>
